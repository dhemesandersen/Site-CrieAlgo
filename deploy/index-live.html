      var d2=caminho(pts2,false); if(d2) g+='<path d="'+d2+'" stroke-dasharray="1 6" stroke-linecap="round"/>';
    }
    gGrid.innerHTML=g;
    var t='';
    /* areas invisiveis so para clique */
    for(var i=0;i<TERRA.length;i++){
      var d3=caminho(TERRA[i].p,true);
      if(d3) t+='<path class="reg" data-go="'+TERRA[i].r+'" d="'+d3+'" fill="transparent" stroke="transparent" stroke-width="8"/>';
    }
    /* pontos halftone */
    var rp;
    for(var j=0;j<PONTOS.length;j++){
      var q=proj(PONTOS[j][0],PONTOS[j][1]);
      if(q[2]<=0) continue;
      rp=PONTOS[j][2];
      var cf=(rp==='en'&&destaque!=='en')?CINZA:COR[rp];
      if(rp!=='en'&&destaque&&destaque!==rp) cf=CINZA;
      var rr2=(rp==='pt'?1.5:2.2)*(0.62+0.38*q[2]);
      t+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+rr2.toFixed(2)+'" fill="'+cf+'" pointer-events="none"/>';
    }
    var pp=proj(-8.4,39.6);
    var cp=(destaque&&destaque!=='pt')?CINZA:'#FFD166';
    if(pp[2]>0) t+='<circle class="reg" data-go="pt" cx="'+pp[0].toFixed(1)+'" cy="'+pp[1].toFixed(1)+'" r="6.5" fill="none" stroke="'+cp+'" stroke-width="2.6"/>';
    gTerra.innerHTML=t;
  }
  var fr=0;
  function laco(){ fr++; if(girar && !arrastando && !reduz && (fr%2===0)){ ROT+=0.32; if(ROT>360) ROT-=360; desenhar(); } requestAnimationFrame(laco); }
  desenhar(); requestAnimationFrame(laco);
  if(svg){
    svg.addEventListener('pointerdown',function(ev){ arrastando=true; xAnt=ev.clientX; svg.setPointerCapture(ev.pointerId); });
    svg.addEventListener('pointermove',function(ev){ if(!arrastando) return; ROT+=(ev.clientX-xAnt)*0.35; xAnt=ev.clientX; desenhar(); });
    svg.addEventListener('pointerup',function(){ arrastando=false; });
    svg.addEventListener('pointercancel',function(){ arrastando=false; });
  }
  function centrar(r, fim){
    var destino=-CENTRO[r];
    while(destino-ROT>180) destino-=360;
    while(destino-ROT<-180) destino+=360;
    var feito=false;
    function terminar(){ if(feito) return; feito=true; fim(); }
    if(reduz){ ROT=destino; desenhar(); return terminar(); }
    girar=false;
    var ini=ROT, t0=null, dur=700;
    setTimeout(function(){ if(!feito){ ROT=destino; try{desenhar();}catch(e){} terminar(); } }, 2200);
    function passo(ts){
      if(feito) return;
      if(t0===null) t0=ts;
      var k=Math.min(1,(ts-t0)/dur);
      var e=k<0.5? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
      ROT=ini+(destino-ini)*e; desenhar();
      if(k<1) requestAnimationFrame(passo); else setTimeout(terminar,120);
    }
    requestAnimationFrame(passo);
  }
  function escolher(r){
    try{ localStorage.setItem(K,r); }catch(e){}
    if(r==='br'){ location.href='/br/'; return; }
    try{ localStorage.setItem(L, r); }catch(e){}
    location.href = location.pathname;
  }
  var botoes=el.querySelectorAll('button.op');
  for(var bi=0;bi<botoes.length;bi++){
    (function(b){
      var rr=b.getAttribute('data-go');
      b.addEventListener('mouseenter',function(){ destaque=rr; desenhar(); });
      b.addEventListener('mouseleave',function(){ destaque=null; desenhar(); });
      b.addEventListener('focus',function(){ destaque=rr; desenhar(); });
      b.addEventListener('blur',function(){ destaque=null; desenhar(); });
    })(botoes[bi]);
  }
  var indo=false;
  function acionar(r){ if(indo||!r) return; indo=true; centrar(r, function(){ escolher(r); }); }
  el.addEventListener('click', function(ev){
    var b=ev.target.closest('button.op'); if(b) return acionar(b.getAttribute('data-go'));
    var p=ev.target.closest('.reg'); if(p) return acionar(p.getAttribute('data-go'));
  });
})();
</script>
